# FinLLM Lab v0.2 — Prometheus scrape configuration (B파트 소유)
#
# scrape_interval 5s는 SLO에서 유도한 값이 아니다. 이 프로젝트의 부하시험이
# 30요청 2초 안에 끝나기 때문에(2026-08-08c 측정, wall 2.03-2.06s) 15s 간격에서는
# 부하 구간 전체가 한두 개 샘플로 뭉개진다. 장애 실험을 관측하기 위한 값이며
# 장기 운영 값으로 검증된 것이 아니다 → PENDING_THRESHOLD_VALIDATION.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: finllm-lab
    profile: profile-a

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ---------------------------------------------------------------- gateway
  # A파트(Codex)의 RAG gateway. interface-contract-v0.2.md 1.2절의 metric을
  # 노출한다. A파트가 아직 배포되지 않았으면 targets/gateway.json이 빈 배열이라
  # target이 0개이고 alert도 울리지 않는다. 존재하지 않는 서비스에 대해
  # ServiceNotReady를 울리는 것은 거짓 신호이기 때문이다.
  - job_name: finllm-gateway
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/gateway.json

  # ------------------------------------------------------------------- vllm
  # vLLM 0.9.2가 자체 노출하는 vllm:* metric. 이름은 추정이 아니라 실제 실행
  # 중인 서버의 /metrics에서 확인했다 (work/v02/vllm-metrics-raw.txt).
  - job_name: vllm
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/vllm.json

  # -------------------------------------------------------------------- gpu
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
