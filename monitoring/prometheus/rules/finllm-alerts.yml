# FinLLM Lab v0.2 — alert rules (B파트 소유)
#
# threshold 출처 규칙
# ------------------
# 이 파일의 숫자는 configs/profiles.json의 benchmark_policy / deployment_profiles
# 에서 온 것만 "근거 있음"으로 취급한다. tests/test_monitoring_config.py가 두
# 값이 어긋나면 실패한다. 여기서 직접 숫자를 바꾸지 말고 configs/profiles.json을
# 바꿔라.
#
# 근거가 없는 값은 annotation에 PENDING_THRESHOLD_VALIDATION으로 표시했다.
# 특히 모든 `for:` 지속시간과 rate window는 아직 측정으로 뒷받침되지 않았다.
# v0.1의 부하시험은 2초짜리 버스트라 "몇 분간 지속되는 이상"을 관측한 적이 없다.

groups:
  - name: finllm-availability
    rules:
      - alert: FinLLMServiceNotReady
        # 근거: 완료 조건 4번(/ready). ready=0인데 트래픽을 받으면 안 된다.
        expr: finllm_ready == 0
        for: 1m
        labels:
          severity: critical
          part: a-service
        annotations:
          summary: "gateway가 ready 아님 (finllm_ready=0)"
          threshold_source: "requirement: /ready must gate traffic"
          for_duration_source: "PENDING_THRESHOLD_VALIDATION — 정상 기동 시간 분포 미측정"
          runbook: "ops/runbooks/service-not-ready.md"

      - alert: FinLLMGatewayDown
        # 근거: scrape 실패는 해석의 여지가 없다.
        expr: up{job="finllm-gateway"} == 0
        for: 30s
        labels:
          severity: critical
          part: a-service
        annotations:
          summary: "gateway /metrics scrape 실패"
          threshold_source: "up == 0 (Prometheus 내장)"
          for_duration_source: "PENDING_THRESHOLD_VALIDATION"
          runbook: "ops/runbooks/service-not-ready.md"

      - alert: FinLLMVLLMUpstreamDown
        # 근거: vLLM이 죽으면 gateway는 어떤 답도 생성할 수 없다.
        # INC-001에서 실제로 이 alert가 울리는 것을 확인했다.
        expr: up{job="vllm"} == 0
        for: 30s
        labels:
          severity: critical
          part: a-service
        annotations:
          summary: "vLLM upstream이 scrape되지 않음 — 추론 불가 상태"
          threshold_source: "up == 0 (Prometheus 내장)"
          for_duration_source: "PENDING_THRESHOLD_VALIDATION"
          runbook: "ops/runbooks/service-not-ready.md"

  - name: finllm-slo
    rules:
      - alert: FinLLMHighRequestErrorRate
        # 근거: configs/profiles.json benchmark_policy.error_rate_max = 0.01
        expr: |
          sum(rate(finllm_requests_total{status=~"5.."}[1m]))
            / sum(rate(finllm_requests_total[1m])) > 0.01
        for: 1m
        labels:
          severity: critical
          part: a-service
        annotations:
          summary: "요청 오류율이 SLO(1%)를 초과"
          threshold_source: "configs/profiles.json benchmark_policy.error_rate_max"
          window_source: "PENDING_THRESHOLD_VALIDATION — 1m rate window는 미검증"
          runbook: "ops/runbooks/high-latency.md"

      - alert: FinLLMHighP95TTFT
        # 근거: configs/profiles.json benchmark_policy.p95_ttft_ms_max = 2000ms
        # gateway histogram은 계약상 le=2 경계를 갖는다(interface-contract-v0.2 1.2절).
        expr: |
          histogram_quantile(
            0.95, sum by (le) (rate(finllm_generation_ttft_seconds_bucket[1m]))
          ) > 2
        for: 2m
        labels:
          severity: warning
          part: a-service
        annotations:
          summary: "P95 TTFT가 SLO(2,000ms)를 초과"
          threshold_source: "configs/profiles.json benchmark_policy.p95_ttft_ms_max"
          for_duration_source: "PENDING_THRESHOLD_VALIDATION"
          runbook: "ops/runbooks/high-latency.md"

      - alert: FinLLMVLLMHighP95TTFT
        # 같은 SLO를 vLLM 자체 histogram으로 본 것. 단, vLLM 0.9.2의
        # time_to_first_token_seconds bucket은 ... 1.0, 2.5, 5.0 ... 이라
        # le=2.0 경계가 없다(work/v02/vllm-metrics-raw.txt에서 확인).
        # 따라서 이 값은 [1.0, 2.5] 구간 선형보간이며 gate 판정용이 아니라
        # upstream 악화의 조기 신호로만 쓴다.
        expr: |
          histogram_quantile(
            0.95, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[1m]))
          ) > 2
        for: 2m
        labels:
          severity: warning
          part: upstream
        annotations:
          summary: "vLLM P95 TTFT 악화 (보간값, gate 판정용 아님)"
          threshold_source: "configs/profiles.json benchmark_policy.p95_ttft_ms_max"
          accuracy_caveat: "vLLM bucket에 le=2.0이 없어 [1.0,2.5] 선형보간"
          runbook: "ops/runbooks/high-latency.md"

  - name: finllm-capacity
    rules:
      - alert: FinLLMRequestQueueBuildup
        # 근거: max_num_seqs = 10 = benchmark_policy.concurrency.
        # 대기 요청이 생겼다는 것은 설계 동시성을 넘었다는 뜻이다.
        expr: vllm:num_requests_waiting > 0
        for: 1m
        labels:
          severity: warning
          part: upstream
        annotations:
          summary: "vLLM 대기 큐가 쌓임 — 설계 동시성 10 초과"
          threshold_source: "configs/profiles.json benchmark_policy.concurrency (= max_num_seqs)"
          for_duration_source: "PENDING_THRESHOLD_VALIDATION"
          runbook: "ops/runbooks/high-latency.md"

      - alert: FinLLMPreemptionObserved
        # 근거: preemption은 KV cache 부족의 직접 신호다. v0.1 측정에서는
        # 0건이었다. 0을 넘는 것 자체가 baseline 이탈이다.
        expr: increase(vllm:num_preemptions_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          part: upstream
        annotations:
          summary: "vLLM이 요청을 preempt했다 — KV cache 압박"
          threshold_source: "v0.1 baseline은 preemption 0건 (2026-08-08c)"
          window_source: "PENDING_THRESHOLD_VALIDATION — 5m window 미검증"
          runbook: "ops/runbooks/gpu-oom.md"

      - alert: FinLLMKVCacheHighUtilization
        expr: vllm:gpu_cache_usage_perc > 0.9
        for: 2m
        labels:
          severity: warning
          part: upstream
        annotations:
          summary: "KV cache 사용률이 높다"
          threshold_source: "PENDING_THRESHOLD_VALIDATION — 0.9는 관례값이며 이 프로젝트에서 측정으로 뒷받침되지 않았다"
          runbook: "ops/runbooks/gpu-oom.md"

  - name: finllm-gpu
    rules:
      - alert: FinLLMGPUMemoryAboveProfileClass
        # 근거: configs/profiles.json deployment_profiles.profile-a.vram_class_gib = 24
        # 24GiB = 24576 MiB. 이 선을 넘으면 Profile A의 대상 카드(24GB class)에
        # 더 이상 들어가지 않는다는 뜻이고, 그것이 이 프로젝트의 핵심 판정이다.
        # v0.1 실측 peak는 21.96GiB였다.
        expr: DCGM_FI_DEV_FB_USED > 24576
        for: 1m
        labels:
          severity: critical
          part: platform
        annotations:
          summary: "GPU 메모리가 Profile A의 24GB class를 초과 — 대상 카드에 더 이상 적합하지 않다"
          threshold_source: "configs/profiles.json deployment_profiles.profile-a.vram_class_gib (24GiB = 24576MiB)"
          baseline: "2026-08-08c 실측 peak 21.96GiB"
          runbook: "ops/runbooks/gpu-oom.md"

      - alert: FinLLMGPUXidError
        # 근거: XID는 드라이버가 보고하는 하드웨어/드라이버 오류다. 0이 정상.
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        for: 0m
        labels:
          severity: critical
          part: platform
        annotations:
          summary: "GPU XID 오류 발생"
          threshold_source: "XID > 0 은 정의상 오류"
          runbook: "ops/runbooks/gpu-oom.md"
