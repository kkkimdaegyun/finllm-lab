name: finllm-lab-v02

services:
  vllm:
    image: finllm-vllm:0.2-vllm0.9.2-cuda12.2.2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.vllm
    command:
      - --model
      - Qwen/Qwen3-14B-AWQ
      - --revision
      - 31c69efc29464b6bb0aee1398b5a7b50a99340c3
      - --tokenizer-revision
      - 31c69efc29464b6bb0aee1398b5a7b50a99340c3
      - --served-model-name
      - Qwen/Qwen3-14B-AWQ
      - --gpu-memory-utilization
      - "0.46"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "10"
      - --tensor-parallel-size
      - "1"
      - --quantization
      - awq
      - --enforce-eager
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      HF_HOME: /opt/finllm/huggingface
      HF_HUB_CACHE: /opt/finllm/huggingface/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_TOKEN_PATH: /run/secrets/hf_token
      VLLM_CACHE_ROOT: /var/cache/finllm/vllm
    secrets:
      - hf_token
    volumes:
      - "${FINLLM_HF_CACHE_DIR:-../work/model-cache/huggingface}:/opt/finllm/huggingface:ro"
      - finllm-vllm-cache:/var/cache/finllm/vllm
    ports:
      - "127.0.0.1:${FINLLM_VLLM_PORT:-8000}:8000"
    shm_size: "${FINLLM_VLLM_SHM_SIZE:-16gb}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${FINLLM_GPU_DEVICE_ID:-1}"]
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read(); urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5).read()"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: "${FINLLM_VLLM_START_PERIOD:-15m}"
    stop_grace_period: "${FINLLM_VLLM_STOP_GRACE_PERIOD:-2m}"
    init: true
    restart: unless-stopped
    networks: [finllm-net]

  finllm-api:
    image: finllm-api:0.2-python3.10.12
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    depends_on:
      vllm:
        condition: service_healthy
        restart: true
    environment:
      FINLLM_CONFIG_PATH: /app/deploy/config/service.json
      FINLLM_CORPUS_DIR: /app/corpus/v0.1
      FINLLM_INDEX_PATH: /var/lib/finllm/index-v0.1.json
      FINLLM_INFERENCE_BASE_URL: http://vllm:8000/v1
      FINLLM_LOG_LEVEL: "${FINLLM_LOG_LEVEL:-INFO}"
      FINLLM_SHUTDOWN_TIMEOUT_SECONDS: "${FINLLM_SHUTDOWN_TIMEOUT_SECONDS:-30}"
      FINLLM_GIT_SHA: "${FINLLM_GIT_SHA:-NOT_PROVIDED}"
      FINLLM_IMAGE_DIGEST: "${FINLLM_IMAGE_DIGEST:-NOT_PROVIDED}"
      FINLLM_EVAL_SET_VERSION: eval-v0.1
    volumes:
      - finllm-service-data:/var/lib/finllm
    ports:
      - "127.0.0.1:${FINLLM_API_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: "${FINLLM_API_STOP_GRACE_PERIOD:-40s}"
    init: true
    restart: unless-stopped
    networks: [finllm-net]

secrets:
  hf_token:
    file: "${FINLLM_HF_TOKEN_FILE:-/dev/null}"

volumes:
  finllm-vllm-cache:
  finllm-service-data:

networks:
  finllm-net:
    external: true
