[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finllm-lab"
version = "0.2.0"
description = "Evidence-driven single-GPU deployment profiling for financial RAG"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
qa = [
  "Pillow>=10,<13",
  "PyMuPDF>=1.24,<2",
  "python-pptx>=1.0,<2",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.setuptools]
packages = []
