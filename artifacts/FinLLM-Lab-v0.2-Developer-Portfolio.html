<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김대균 · FinLLM Lab v0.2 · Developer Portfolio</title>
  <style>
@font-face { font-family: "NotoPortfolio"; src: local("Noto Sans KR"); }
:root { --bg:#07111F; --surface:#102038; --surface-alt:#142B49; --text:#F5F8FC; --muted:#A4B5CA; --cyan:#39D6C1; --amber:#F6BA57; --green:#6EE7A8; --line:#2B4565; }
* { box-sizing: border-box; }
html, body { margin:0; background:#030912; color:var(--text); font-family:var(--portfolio-font,"NotoPortfolio"),"NotoPortfolio","Noto Sans KR",sans-serif; }
body { padding:32px; }
#deck { display:flex; flex-direction:column; align-items:center; gap:32px; }
.slide { width:1280px; height:720px; position:relative; overflow:hidden; padding:50px 62px 42px; background:radial-gradient(circle at 90% 0%,#123657 0,transparent 34%),var(--bg); box-shadow:0 18px 60px #0009; display:grid; grid-template-rows:112px 1fr 32px; }
.slide::before { content:""; position:absolute; top:0; left:0; width:10px; height:100%; background:var(--cyan); }
header { position:relative; border-bottom:1px solid var(--line); }
header>span { color:var(--cyan); letter-spacing:.16em; font-size:15px; font-weight:800; }
header>em { position:absolute; right:0; top:-8px; color:#53708f; font-style:normal; font-size:28px; font-weight:800; }
h1 { margin:12px 70px 0 0; font-size:36px; line-height:1.2; letter-spacing:-.035em; }
.content { padding:24px 0 18px; min-height:0; }
footer { display:flex; justify-content:space-between; align-items:flex-end; border-top:1px solid var(--line); color:var(--muted); font-size:13px; padding-top:10px; white-space:nowrap; }
footer small { max-width:56%; overflow:hidden; text-overflow:ellipsis; }
.lead { margin:0 0 20px; font-size:24px; color:#dce9f7; }
.cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.learning-grid .cards { grid-template-columns:repeat(4,1fr); }
.learning-grid .card { min-height:198px; }
.card { min-height:142px; padding:17px 18px; background:linear-gradient(140deg,var(--surface),var(--surface-alt)); border:1px solid var(--line); border-radius:11px; }
.card>span,.steps article>span,.evolution section>span,.lanes section>span { color:var(--cyan); font-size:12px; font-weight:900; letter-spacing:.12em; }
.card h3 { margin:9px 0 6px; font-size:20px; }
.card p { margin:0; color:var(--muted); font-size:15px; line-height:1.45; }
.card small { display:block; margin-top:8px; color:var(--amber); font-size:12px; }
blockquote { margin:5px auto 25px; padding:26px 36px; border-left:5px solid var(--cyan); background:var(--surface); border-radius:0 12px 12px 0; font-size:31px; line-height:1.45; font-weight:700; }
.criteria { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.criteria article { padding:14px 16px; background:var(--surface-alt); border:1px solid var(--line); border-radius:9px; }
.criteria b,.criteria span { display:block; }
.criteria b { color:var(--cyan); font-size:17px; }
.criteria span { margin-top:4px; color:var(--muted); font-size:14px; }
.rule,.status-line { text-align:center; margin:18px 0 0; color:var(--amber); font-weight:700; font-size:17px; }
.flow { display:flex; align-items:center; gap:10px; margin:12px 0 28px; }
.flow article { flex:1; min-height:88px; display:flex; flex-direction:column; justify-content:center; text-align:center; border:1px solid var(--cyan); background:var(--surface); border-radius:10px; padding:12px; }
.flow b { font-size:19px; }
.flow span { color:var(--muted); font-size:13px; margin-top:6px; }
.flow i,.steps i,.evolution>i,.loop i { color:var(--cyan); font-style:normal; font-size:25px; }
.rails { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.rails section { padding:15px 20px; background:var(--surface-alt); border-radius:10px; }
.rails b { color:var(--amber); }
.rails ul { display:flex; gap:24px; margin:10px 0 0; padding-left:18px; color:var(--muted); }
table { width:100%; border-collapse:collapse; font-size:16px; overflow:hidden; border-radius:10px; }
th { background:#17395b; color:var(--cyan); text-align:right; padding:13px 12px; }
th:first-child,td:first-child { text-align:left; }
td { background:var(--surface); border-top:1px solid var(--line); padding:15px 12px; text-align:right; }
tr.highlight td { background:#14413f; color:#fff; font-weight:700; }
.note { color:var(--muted); font-size:14px; margin:12px 0 0; }
.decision { padding:13px 16px; margin:13px 0 0; background:#15324b; border-left:4px solid var(--amber); border-radius:0 8px 8px 0; font-size:16px; }
.steps { display:flex; align-items:stretch; gap:9px; }
.steps article { flex:1; padding:15px; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
.steps h3 { margin:9px 0; font-size:18px; }
.steps article>b { display:block; color:var(--amber); font-size:21px; }
.steps p { color:var(--muted); margin:8px 0 0; font-size:14px; }
.content .evolution { display:grid; grid-template-columns:1fr 55px 1fr; align-items:center; }
.content .evolution>i { text-align:center; font-size:38px; }
.content .evolution section { padding:16px 24px; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
.content .evolution h2 { margin:7px 0; font-size:24px; }
.content .evolution ul { columns:2; color:var(--muted); margin:8px 0; }
.verification { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
.verification article { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; padding:13px; background:var(--surface-alt); border-radius:9px; }
.verification .ok { color:var(--green); font-size:12px; font-weight:900; }
.verification strong { grid-column:2; color:var(--cyan); }
.verification small { grid-column:1/3; color:var(--muted); }
.content .timeline { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
.content .timeline article { position:relative; min-height:170px; padding:15px 13px; background:var(--surface); border-top:4px solid var(--cyan); border-radius:8px; }
.content .timeline article>span { color:var(--cyan); font-size:11px; font-weight:900; }
.content .timeline h3 { font-size:16px; margin:10px 0; }
.content .timeline b { color:var(--amber); font-size:19px; }
.content .timeline p { color:var(--muted); font-size:13px; }
.lanes { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.lanes section { padding:16px 22px; border:1px solid var(--line); background:var(--surface); border-radius:10px; }
.lanes h3 { margin:6px 0; }
.lanes ul { display:flex; gap:25px; color:var(--muted); }
.loop { display:flex; align-items:center; justify-content:center; gap:12px; margin:17px 0; }
.loop b { padding:8px 10px; background:#173b50; border-radius:7px; font-size:13px; }
.findings { display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:20px; }
.findings ul { margin:0; color:var(--muted); columns:2; }
.findings strong { color:var(--amber); text-align:center; }
.risk-register .cards { grid-template-columns:repeat(3,1fr); }
.risk-register .card { min-height:120px; }
.verdict-inline { margin-top:15px; display:flex; gap:20px; align-items:center; padding:12px 18px; background:#12433e; border:1px solid var(--green); border-radius:9px; }
.verdict-inline b { color:var(--green); font-size:19px; }
.verdict-inline span { color:#dce8f2; font-size:14px; }
.cover { grid-template-rows:112px 1fr 32px; }
.cover-copy { max-width:850px; padding-top:32px; }
.cover-copy h2 { margin:0; font-size:48px; line-height:1.25; letter-spacing:-.04em; }
.cover-copy p { color:var(--muted); font-size:21px; margin:22px 0; }
.tags { display:flex; flex-wrap:wrap; gap:8px; }
.tags span { padding:7px 12px; border:1px solid var(--line); background:var(--surface); color:#d9e9f8; border-radius:999px; font-size:13px; }
.verdict { position:absolute; right:62px; bottom:105px; width:300px; padding:19px; border:1px solid var(--green); background:#12352f; border-radius:11px; }
.verdict b,.verdict small { display:block; }
.verdict b { color:var(--green); font-size:20px; }
.verdict small { margin-top:8px; color:#cfe5dd; line-height:1.4; }
.pitch { font-size:23px; margin:0 0 20px; }
.summary-grid { display:grid; grid-template-columns:2fr 1fr; gap:20px; }
.summary-grid section { padding:16px; background:var(--surface); border-radius:10px; }
.summary-grid section>b { color:var(--cyan); font-size:13px; letter-spacing:.12em; }
.summary-grid ul { color:var(--muted); margin-bottom:0; }
.closing { text-align:center; color:var(--amber); font-weight:700; margin-top:15px; }
body.single { padding:0; overflow:hidden; }
body.single #deck { gap:0; }
body.single .slide { box-shadow:none; }
@page { size:13.333in 7.5in; margin:0; }
@media print { body { padding:0; } #deck { gap:0; } .slide { break-after:page; box-shadow:none; } }

      if (slide.layout === "cover") return `
        <div class="cover-copy"><h2>${esc(c.headline).replace(/\n/g,"<br>")}</h2><p>${esc(c.subheadline)}</p>
        <div class="tags">${c.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div></div>
        <aside class="verdict pass"><b>${esc(c.verdict)}</b><small>${esc(c.verdict_note)}</small></aside>`;
      if (slide.layout === "constraint-grid") return `<p class="lead">${esc(c.headline)}</p>${cards(c.cards)}`;
      if (slide.layout === "question") return `<blockquote>${esc(c.quote)}</blockquote><div class="criteria">${c.criteria.map(v => `<article><b>${esc(v.name)}</b><span>${esc(v.detail)}</span></article>`).join("")}</div><p class="rule">${esc(c.rule)}</p>`;
      if (slide.layout === "architecture") return `<div class="flow">${c.flow.map((v,i) => `${i?'<i>→</i>':''}<article><b>${esc(v.name)}</b><span>${esc(v.detail)}</span></article>`).join("")}</div><div class="rails"><section><b>OBSERVE</b>${items(c.ops)}</section><section><b>CHANGE SAFETY</b>${items(c.safety)}</section></div><p class="status-line">${esc(c.status)}</p>`;
      if (slide.layout === "data-table") return `<table><thead><tr>${c.table.headers.map(v=>`<th>${esc(v)}</th>`).join("")}</tr></thead><tbody>${c.table.rows.map((row,i)=>`<tr class="${i===c.table.highlight_row?'highlight':''}">${row.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table><p class="note">${esc(c.note)}</p><p class="decision">${esc(c.decision)}</p>`;
      if (slide.layout === "autopsy") return `<div class="steps">${c.steps.map((v,i)=>`${i?'<i>→</i>':''}<article><span>${esc(v.label)}</span><h3>${esc(v.title)}</h3><b>${esc(v.metric)}</b><p>${esc(v.text)}</p></article>`).join("")}</div><p class="decision">${esc(c.corrected)}</p><p class="rule">${esc(c.principle)}</p>`;
      if (slide.layout === "evolution") return `<div class="evolution"><section><span>${esc(c.before.label)}</span><h2>${esc(c.before.title)}</h2>${items(c.before.items)}</section><i>→</i><section><span>${esc(c.after.label)}</span><h2>${esc(c.after.title)}</h2>${items(c.after.items)}</section></div><div class="verification">${c.verification.map(v=>`<article><span class="ok">${esc(v.status)}</span><b>${esc(v.name)}</b><strong>${esc(v.value)}</strong><small>${esc(v.note)}</small></article>`).join("")}</div>`;
      if (slide.layout === "timeline") return `<div class="timeline">${c.timeline.map(v=>`<article><span>${esc(v.time)}</span><h3>${esc(v.title)}</h3><b>${esc(v.value)}</b><p>${esc(v.detail)}</p></article>`).join("")}</div><p class="decision">${esc(c.lesson)}</p><p class="note">${esc(c.caveat)}</p>`;
      if (slide.layout === "review-loop") return `<div class="lanes">${c.lanes.map(v=>`<section><span>${esc(v.owner)}</span><h3>${esc(v.scope)}</h3>${items(v.outputs)}</section>`).join("")}</div><div class="loop">${c.loop.map((v,i)=>`${i?'<i>→</i>':''}<b>${esc(v)}</b>`).join("")}</div><div class="findings">${items(c.findings)}<strong>${esc(c.judge)}</strong></div>`;
      if (slide.layout === "learning-grid") return cards(c.cards);
      if (slide.layout === "risk-register") return `${cards(c.risks)}<div class="verdict-inline"><b>${esc(c.verdict)}</b><span>${esc(c.note)}</span></div>`;
      if (slide.layout === "summary") return `<blockquote class="pitch">${esc(c.pitch)}</blockquote><div class="summary-grid"><section><b>CORE STACK</b><div class="tags">${c.stack.map(v=>`<span>${esc(v)}</span>`).join("")}</div></section><section><b>${esc(c.side_label || "NEXT")}</b>${items(c.next)}</section></div><p class="closing">${esc(c.closing)}</p>`;
      return `<pre>${esc(JSON.stringify(c,null,2))}</pre>`;
    }

    const deckData = window.__FINLLM_DATA__
      ? Promise.resolve(window.__FINLLM_DATA__)
      : fetch("slide-data.json").then(r => r.json());

    deckData.then(data => {
      const selected = Number(new URLSearchParams(location.search).get("slide") || 0);
      const slides = selected ? data.slides.filter(s => s.number === selected) : data.slides;
      document.documentElement.style.setProperty("--bg", data.theme.background);
      document.documentElement.style.setProperty("--surface", data.theme.surface);
      document.documentElement.style.setProperty("--surface-alt", data.theme.surface_alt);
      document.documentElement.style.setProperty("--text", data.theme.text);
      document.documentElement.style.setProperty("--muted", data.theme.muted);
      document.documentElement.style.setProperty("--cyan", data.theme.cyan);
      document.documentElement.style.setProperty("--amber", data.theme.amber);
      document.documentElement.style.setProperty("--green", data.theme.green);
      document.documentElement.style.setProperty("--line", data.theme.line);
      document.documentElement.style.setProperty("--portfolio-font", `"${data.theme.font}"`);
      document.getElementById("deck").innerHTML = slides.map(slide => `<section class="slide ${esc(slide.layout)}">
        <header><span>${esc(slide.eyebrow)}</span><em>${String(slide.number).padStart(2,"0")}</em><h1>${esc(slide.title)}</h1></header>
        <div class="content">${renderContent(slide)}</div>
        <footer><span>${esc(slide.footer)}</span><small>EVIDENCE · ${esc(slide.evidence[0])}</small></footer>
      </section>`).join("");
      document.body.classList.toggle("single", Boolean(selected));
      document.fonts.ready.then(() => { window.__FINLLM_READY__ = true; });
    }).catch(error => { document.getElementById("deck").textContent = error.stack; });
  </script>
</body>
</html>
